name: catfetch

on:
  schedule:
    - cron: "30 2,14 * * *"   # feeding time: 08:00 and 20:00 IST
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ scripts/catfetch.py, .github/workflows/catfetch.yml ]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/catfetch.py
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Feed the cat [Skip GitHub Action]"
          # metrics.yml may have pushed its own commit in the meantime
          git pull --rebase && git push
